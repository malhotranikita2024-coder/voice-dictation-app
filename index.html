<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Voice Dictation App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Voice Dictation App</h1>
    <p>v1 — record, clean up with Groq, paste into whatever app has focus.</p>

    <button id="recordButton">Record 10-20 seconds</button>
    <p>After clicking Record, you have 2 seconds to Alt+Tab to the app you want to dictate into. Recording auto-stops after 15 seconds — no need to click back into this window.</p>
    <div id="status"></div>

    <script src="renderer.js"></script>
  </body>
</html>
