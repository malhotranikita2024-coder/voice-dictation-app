<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Voice Dictation App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Voice Dictation App</h1>
    <p>v1 — record, clean up with Groq, paste into whatever app has focus.</p>

    <p><strong>Hold Ctrl+Shift anywhere in Windows</strong> — even outside this window — speak, then release. No time limit.</p>

    <button id="recordButton">Record (manual fallback)</button>
    <p>The button is a fallback for testing without the hotkey — click once to start, click again to stop.</p>
    <div id="status"></div>

    <script src="renderer.js"></script>
  </body>
</html>
